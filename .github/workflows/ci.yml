name: CI

# The real quality gate. The husky pre-commit hook runs the same `npm run ci`, but hooks
# are bypassable with --no-verify, so this is the enforcement point. Make these checks
# required in branch protection on main.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job here writes anything. Jobs that need more raise it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Matches the dev machines; README documents Node 20+ as the floor.
  NODE_VERSION: '24'

jobs:
  quality:
    name: lint / format / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client/score-web/package-lock.json
      # `npm ci` triggers postinstall, which bundles score-web into
      # client/src/score-web/html.ts. That file is imported by three screens, so if the
      # bundle failed to generate, typecheck and test below fail loudly — there is no
      # separate drift check to keep honest.
      - run: npm ci
        working-directory: client
      - run: npm run ci
        working-directory: client

# The PR-title check lives in .github/workflows/pr-title.yml — it needs the `edited`
# trigger, which this workflow deliberately does not use.
