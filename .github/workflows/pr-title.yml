name: PR title

# Deliberately its own workflow rather than a job in ci.yml. A bare `on: pull_request`
# defaults to [opened, synchronize, reopened] — NOT `edited` — so renaming a PR to fix a
# failed title check would never re-run it, and re-running the job by hand replays the
# original event payload with the old title. `edited` is the whole point here.
#
# Keeping it separate also means a title or description edit does not re-run lint,
# typecheck and jest. Do not merge this back into ci.yml.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    # The repo squash-merges, so the PR title becomes the commit message on main — which
    # is what the `release` skill reads to infer the next version and write the changelog.
    # Linting it with the repo's own commitlint config keeps one list of allowed types
    # instead of two.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint title
        # Passed via env, never interpolated into the shell: a PR title is attacker-
        # controlled text and `${{ ... }}` inside `run:` is a script-injection sink.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx --no -- commitlint
