name: Sync app version on release PR

# release-please only edits client/package.json. client/app.json needs the same semver
# plus an integer versionCode, and those values must already be correct in the commit
# that gets tagged — so the sync happens on the release PR, not at build time.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sync:
    # Only ever touches branches release-please created in this repo.
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # Pushing with a PAT rather than GITHUB_TOKEN so the resulting `synchronize`
          # event re-runs CI — otherwise the version-sync check stays red on the stale
          # commit and the PR can never go green.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: node scripts/sync-app-version.mjs

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- client/app.json; then
            echo "app.json already in sync; nothing to push."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/app.json
          git commit -m 'chore: sync app.json version and versionCode'
          git push
