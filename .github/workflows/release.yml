name: Release

# Dispatch-only, on purpose. Nothing about landing a commit on `main` ships anything:
# a human picks the commit with the `/release` skill, which creates the tag and the
# draft release and then fires this workflow to build and attach the APK.
#
# This is also the recovery path when an EAS build fails after the tag already exists —
# re-running it re-attaches assets without cutting a new version. It is not a way to
# mint extra builds against the 15/month free-tier cap.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and attach an APK to, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  # Never cancel: an in-flight run may already be holding an EAS build slot.
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build-apk:
    name: Build APK and attach to draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploading assets to the release
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            client/score-web/package-lock.json

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        working-directory: client

      # The tag is the version. `client/app.json` is committed with 0.0.0 placeholders,
      # so the real values are written here, into this workspace only — nothing is ever
      # committed back.
      #
      # Derived inline rather than by calling a script from the tree: `checkout` above
      # uses `ref: <tag>`, so any script it finds is whatever *that tag* happens to
      # contain. Inline keeps re-builds of old tags working.
      #
      # versionCode is a monotonically increasing integer Android refuses to go
      # backwards on. major*10000 + minor*100 + patch keeps it reconstructible from any
      # tag, at the cost of capping minor and patch at 99 — fail loudly rather than
      # silently producing a colliding number.
      - name: Derive the app version from the tag
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not a plain vX.Y.Z semver tag"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::version $version overflows the versionCode encoding (minor and patch must be <= 99)"
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          jq --arg v "$version" --argjson c "$code" \
            '.expo.version = $v | .expo.android.versionCode = $c' \
            client/app.json > "$RUNNER_TEMP/app.json"
          mv "$RUNNER_TEMP/app.json" client/app.json
          echo "version $version, versionCode $code"

      - name: Build on EAS and wait
        working-directory: client
        # The `preview` profile produces an APK (eas.json). Signing happens on EAS with
        # the managed keystore — no signing material is ever present on this runner.
        run: eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/eas-build.json"

      - name: Download the APK and checksum it
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="$(jq -er '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' "$RUNNER_TEMP/eas-build.json")"
          apk="openrehearse-${version}.apk"
          curl -fSL "$url" -o "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The release is a draft. A human sideloads the APK, confirms a score imports and
        # plays, and only then publishes it.
        run: gh release upload "$TAG" openrehearse-*.apk SHA256SUMS.txt --clobber
